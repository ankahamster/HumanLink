<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>humanlink_record</title>
  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color-scheme: light dark;
    }

    body {
      margin: 0;
      background: #0f172a;
      color: #e2e8f0;
    }

    main {
      max-width: 760px;
      margin: 40px auto;
      padding: 0 20px 40px;
    }

    .card {
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    p {
      color: #cbd5e1;
      line-height: 1.6;
    }

    .grid {
      display: grid;
      gap: 12px;
      margin-top: 20px;
    }

    .item {
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-radius: 12px;
      padding: 14px 16px;
      background: rgba(30, 41, 59, 0.7);
    }

    .label {
      display: block;
      font-size: 12px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }

    .value {
      word-break: break-word;
      font-size: 15px;
    }

    .wallet-panel {
      margin-top: 20px;
      display: grid;
      gap: 12px;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 24px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .local {
      background: #334155;
      color: #f8fafc;
    }

    .primary {
      background: #22c55e;
      color: #052e16;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .status {
      margin-top: 18px;
      min-height: 24px;
      white-space: pre-wrap;
      color: #bfdbfe;
    }

    .hint {
      margin-top: 10px;
      color: #94a3b8;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>humanlink_record</h1>
      <p>本次 HumanLink 授权已经成功。请选择是仅保留本地审计记录，还是连接钱包，由当前钱包用户支付 gas 费并把授权摘要写入链上合约。</p>

      <div class="grid">
        <div class="item">
          <span class="label">操作</span>
          <span id="action" class="value">加载中...</span>
        </div>
        <div class="item">
          <span class="label">Assertion ID</span>
          <span id="assertion-id" class="value">加载中...</span>
        </div>
        <div class="item">
          <span class="label">创建时间</span>
          <span id="created-at" class="value">加载中...</span>
        </div>
        <div class="item">
          <span class="label">链上配置</span>
          <span id="contract-config" class="value">加载中...</span>
        </div>
      </div>

      <div class="wallet-panel">
        <div class="item">
          <span class="label">钱包状态</span>
          <span id="wallet-status" class="value">未连接</span>
        </div>
        <div class="item">
          <span class="label">当前账户</span>
          <span id="wallet-address" class="value">(未连接)</span>
        </div>
      </div>

      <div class="actions">
        <button id="keep-local" class="local" type="button">仅本地保留</button>
        <button id="connect-wallet" class="primary" type="button">连接钱包</button>
        <button id="anchor-chain" class="primary" type="button">钱包签名并上链</button>
      </div>

      <div class="status" id="status"></div>
      <div class="hint">当前页面使用浏览器钱包直接调用 `AssertionStatusRegistry.recordAssertionAudit(...)`，gas 费由当前钱包用户支付。</div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.umd.min.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const auditSessionId = params.get("audit_session_id");
    const statusEl = document.getElementById("status");
    const keepLocalBtn = document.getElementById("keep-local");
    const connectWalletBtn = document.getElementById("connect-wallet");
    const anchorChainBtn = document.getElementById("anchor-chain");
    const walletStatusEl = document.getElementById("wallet-status");
    const walletAddressEl = document.getElementById("wallet-address");

    let auditSession = null;
    let provider = null;
    let signer = null;
    let signerAddress = "";

    const CONTRACT_ABI = [
      "function recordAssertionAudit((bytes32 assertionHash,bytes32 assertionIdHash,bytes32 deviceDidHash,bytes32 requiredIssuerDidHash,bytes32 actionHash,bytes32 nonceHash,bytes32 originHash,bytes32 verificationMethodHash,bytes32 signedHash,bytes32 sensorSerialHash,uint16 matchScore,uint64 createdAt,string protocolVersion) input)",
      "function recorders(address) view returns (bool)",
      "function hasAuditRecord(bytes32 assertionHash) view returns (bool)"
    ];

    function setStatus(message) {
      statusEl.textContent = message || "";
    }

    function setBusy(busy) {
      keepLocalBtn.disabled = busy;
      connectWalletBtn.disabled = busy;
      anchorChainBtn.disabled = busy;
    }

    function setWalletState(status, address = "") {
      walletStatusEl.textContent = status;
      walletAddressEl.textContent = address || "(未连接)";
    }

    function stableStringify(value) {
      if (Array.isArray(value)) {
        return `[${value.map((item) => stableStringify(item)).join(",")}]`;
      }

      if (value && typeof value === "object") {
        const keys = Object.keys(value).sort();
        return `{${keys.map((key) => `${JSON.stringify(key)}:${stableStringify(value[key])}`).join(",")}}`;
      }

      return JSON.stringify(value);
    }

    function pick(source, ...keys) {
      for (const key of keys) {
        if (source && source[key] !== undefined && source[key] !== null) {
          return source[key];
        }
      }
      return undefined;
    }

    function hashUtf8(value) {
      return ethers.keccak256(ethers.toUtf8Bytes(String(value || "")));
    }

    function toBytes32Hex(value, fieldName) {
      if (!value) {
        return ethers.ZeroHash;
      }

      const normalized = String(value).startsWith("0x") ? String(value) : `0x${value}`;
      if (!ethers.isHexString(normalized) || ethers.dataLength(normalized) !== 32) {
        throw new Error(`${fieldName} 必须是 32 字节十六进制`);
      }
      return normalized;
    }

    function toUnixSeconds(isoString) {
      const timestamp = Date.parse(isoString);
      if (Number.isNaN(timestamp)) {
        throw new Error(`无效时间戳: ${isoString}`);
      }
      return Math.floor(timestamp / 1000);
    }

    function buildAuditInput(assertion) {
      const challenge = assertion.challenge || {};
      const proof = assertion.proof || {};
      const evidence = assertion.evidence || {};
      const canonicalAssertion = stableStringify(assertion);

      return {
        assertionHash: hashUtf8(canonicalAssertion),
        assertionIdHash: hashUtf8(assertion.id || ""),
        deviceDidHash: hashUtf8(pick(assertion.device || {}, "id") || ""),
        requiredIssuerDidHash: hashUtf8(pick(challenge, "required_issuer_did", "requiredIssuerDID") || ""),
        actionHash: toBytes32Hex(pick(challenge, "action_hash", "actionHash"), "actionHash"),
        nonceHash: hashUtf8(pick(challenge, "nonce") || ""),
        originHash: hashUtf8(pick(challenge, "origin") || ""),
        verificationMethodHash: hashUtf8(pick(proof, "verification_method", "verificationMethod") || ""),
        signedHash: toBytes32Hex(pick(proof, "signed_hash", "signedHash"), "signedHash"),
        sensorSerialHash: hashUtf8(pick(evidence, "sensor_serial", "sensorSerial") || ""),
        matchScore: Number(pick(evidence, "match_score", "matchScore") || 0),
        createdAt: toUnixSeconds(assertion.created),
        protocolVersion: assertion.version || "0.3"
      };
    }

    async function ensureCorrectNetwork(config) {
      const desiredHexChainId = `0x${Number(config.chainId || 11155111).toString(16)}`;
      try {
        await window.ethereum.request({
          method: "wallet_switchEthereumChain",
          params: [{ chainId: desiredHexChainId }]
        });
      } catch (error) {
        if (error && error.code === 4902 && config.rpcUrl) {
          await window.ethereum.request({
            method: "wallet_addEthereumChain",
            params: [{
              chainId: desiredHexChainId,
              chainName: String(config.network || "HumanLink Network"),
              rpcUrls: [config.rpcUrl],
              nativeCurrency: {
                name: "Ether",
                symbol: "ETH",
                decimals: 18
              },
              blockExplorerUrls: config.network === "sepolia" ? ["https://sepolia.etherscan.io"] : []
            }]
          });
          return;
        }
        throw error;
      }
    }

    async function connectWallet() {
      if (!window.ethereum) {
        throw new Error("未检测到浏览器钱包，请先安装 MetaMask 或兼容钱包。");
      }
      if (!auditSession) {
        throw new Error("授权记录尚未加载完成。");
      }

      await ensureCorrectNetwork(auditSession.config || {});

      provider = new ethers.BrowserProvider(window.ethereum);
      await provider.send("eth_requestAccounts", []);
      signer = await provider.getSigner();
      signerAddress = await signer.getAddress();
      setWalletState("已连接", signerAddress);
      return signerAddress;
    }

    async function loadAuditSession() {
      if (!auditSessionId) {
        setStatus("缺少 audit_session_id，无法加载授权记录。");
        setBusy(true);
        return;
      }

      try {
        const response = await fetch(`/audit/session/${encodeURIComponent(auditSessionId)}`);
        const payload = await response.json();
        if (!response.ok) {
          throw new Error(payload.detail || "加载授权记录失败");
        }

        auditSession = payload;

        document.getElementById("action").textContent = payload.action || "(空)";
        document.getElementById("assertion-id").textContent = payload.assertion?.id || "(缺失)";
        document.getElementById("created-at").textContent = payload.created_at || "(未知)";

        const config = payload.config || {};
        const walletMode = config.walletModeAvailable ? "已配置链上地址" : "未配置链上地址";
        const address = config.contractAddress || "(未配置)";
        document.getElementById("contract-config").textContent = `${walletMode} / ${address}`;

        if (!config.contractAddress) {
          anchorChainBtn.disabled = true;
          setStatus("未检测到链上合约地址，请先配置 AssertionStatusRegistry 地址。");
          return;
        }

        setStatus("授权记录已就绪，请选择处理方式。");
      } catch (error) {
        setStatus(error.message || String(error));
        setBusy(true);
      }
    }

    keepLocalBtn.addEventListener("click", () => {
      setBusy(true);
      setStatus("已选择仅保留本地审计记录。现在可以关闭此页面。");
    });

    connectWalletBtn.addEventListener("click", async () => {
      setBusy(true);
      setStatus("正在连接钱包...");
      try {
        const address = await connectWallet();
        setStatus(`钱包已连接：${address}`);
      } catch (error) {
        setStatus(error.message || String(error));
      } finally {
        setBusy(false);
      }
    });

    anchorChainBtn.addEventListener("click", async () => {
      if (!auditSession) {
        setStatus("授权记录尚未加载完成。");
        return;
      }

      setBusy(true);
      setStatus("准备连接钱包并发起链上交易...");

      try {
        if (!signer) {
          await connectWallet();
        }

        const config = auditSession.config || {};
        const contractAddress = config.contractAddress;
        if (!contractAddress) {
          throw new Error("未配置 AssertionStatusRegistry 合约地址。");
        }

        const contract = new ethers.Contract(contractAddress, CONTRACT_ABI, signer);
        const input = buildAuditInput(auditSession.assertion || {});

        const alreadyRecorded = await contract.hasAuditRecord(input.assertionHash);
        if (alreadyRecorded) {
          setStatus("该授权记录已经上链，无需重复提交。");
          return;
        }

        const isRecorder = await contract.recorders(signerAddress);
        if (!isRecorder) {
          throw new Error(`当前钱包 ${signerAddress} 不在合约的 recorder 白名单中，无法写入链上记录。`);
        }

        setStatus("钱包已连接，正在等待你在钱包中确认交易...");
        const tx = await contract.recordAssertionAudit(input);
        setStatus(`交易已提交，等待确认...\nTransaction Hash: ${tx.hash}`);
        const receipt = await tx.wait();

        setStatus(`上链成功。\nTransaction Hash: ${receipt.hash}\nGas Used: ${receipt.gasUsed.toString()}`);
      } catch (error) {
        setStatus(error.message || String(error));
        setBusy(false);
        return;
      }

      setBusy(true);
    });

    loadAuditSession();
  </script>
</body>
</html>
